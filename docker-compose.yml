version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: eams-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eams_db
    ports:
      - "3306:3306"
    volumes:
      - eams_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  springapp:
    build:
      context: ./springapp
    container_name: eams-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eams_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: eamsSuperSecretKeyForJwtSigningPurposesMustBeLongEnough123456789
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
    ports:
      - "8080:8080"

  reactapp:
    build:
      context: ./reactapp
    container_name: eams-frontend
    restart: unless-stopped
    depends_on:
      - springapp
    environment:
      REACT_APP_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  eams_mysql_data:
