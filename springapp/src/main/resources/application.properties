spring.application.name=employee-attendance-management-system

# ---------- MySQL Datasource ----------
spring.datasource.url=jdbc:mysql://localhost:3306/eams_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Server ----------
server.port=8080

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:eamsSuperSecretKeyForJwtSigningPurposesMustBeLongEnough123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# ---------- Attendance rules (defaults) ----------
app.attendance.full-day-hours=8
app.attendance.half-day-hours=4
